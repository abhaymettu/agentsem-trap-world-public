[project]
name = "agentsem-trap-world"
version = "0.1.0"
description = "Smallest reproducible simulation that proves or kills the agentSEM helpful-agent trap"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trapworld"]
